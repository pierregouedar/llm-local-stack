# Service "pc-wake" (NAS, Docker) : reveille le PC et s'assure que la pile IA tourne.
#   GET /status : {"pc_up": agent du PC joignable, "stack_up": llama-swap joignable}
#   GET /wake   : Wake-on-LAN si besoin -> attend l'agent du PC -> lui demande de demarrer la pile
#                 si elle ne tourne pas -> attend que llama-swap reponde (max ~4 min)
#   GET /stop   : demande a l'agent d'arreter la pile (libere la VRAM)
# Configuration : fichier .env a cote (copie de .env.example). Le jeton de l'agent est dans
# pc/secrets/agent-token.txt sur le PC (cree au 1er lancement de "Demarrer IA.bat").
# network_mode: host : indispensable pour que le paquet de reveil atteigne le reseau local.

name: pc-wake
services:
  pc-wake:
    image: python:3.12-alpine
    container_name: pc-wake
    restart: unless-stopped
    network_mode: host
    environment:
      PC_MAC: ${PC_MAC}
      BROADCAST: ${BROADCAST}
      PC_IP: ${PC_IP}
      AGENT_PORT: ${AGENT_PORT:-8090}
      LLAMA_PORT: ${LLAMA_PORT:-8080}
      AGENT_TOKEN: ${AGENT_TOKEN}
      PORT: ${PCWAKE_PORT:-8199}
    command:
      - python
      - -c
      - |
        import os, socket, time, json, urllib.request
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        E = os.environ
        MAC = bytes.fromhex(E["PC_MAC"].replace(":", "").replace("-", ""))
        IP = E["PC_IP"]
        def port_up(p):
            try:
                socket.create_connection((IP, int(p)), timeout=2).close(); return True
            except OSError:
                return False
        def agent(method, path):
            req = urllib.request.Request(f"http://{IP}:{E['AGENT_PORT']}{path}", method=method,
                                         headers={"Authorization": "Bearer " + E["AGENT_TOKEN"]})
            with urllib.request.urlopen(req, timeout=10) as r:
                return json.loads(r.read() or b"{}")
        def wol():
            pkt = b"\xff" * 6 + MAC * 16
            s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            s.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)
            for dest in (E["BROADCAST"], "255.255.255.255"):
                for p in (9, 7):
                    s.sendto(pkt, (dest, p))
            s.close()
        def wait(cond, seconds, every=1.0, action=None):
            t0 = time.time()
            while time.time() - t0 < seconds:
                if cond():
                    return True
                if action:
                    action()
                time.sleep(every)
            return cond()
        class H(BaseHTTPRequestHandler):
            def reply(self, code, obj):
                b = json.dumps(obj).encode()
                self.send_response(code); self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
            def do_GET(self):
                t0 = time.time()
                if self.path.startswith("/status"):
                    return self.reply(200, {"pc_up": port_up(E["AGENT_PORT"]), "stack_up": port_up(E["LLAMA_PORT"])})
                if self.path.startswith("/stop"):
                    if not port_up(E["AGENT_PORT"]):
                        return self.reply(503, {"error": "agent du PC injoignable"})
                    return self.reply(200, agent("POST", "/stop"))
                if self.path.startswith("/wake"):
                    woken = False
                    if not port_up(E["AGENT_PORT"]):
                        woken = True
                        if not wait(lambda: port_up(E["AGENT_PORT"]), 180, 2, wol):
                            return self.reply(504, {"error": "le PC (agent) ne repond pas apres 3 min",
                                                    "hint": "PC eteint ou redemarre : lancer 'Demarrer IA.bat' sur le PC"})
                    started = False
                    if not port_up(E["LLAMA_PORT"]):
                        started = bool(agent("POST", "/start").get("started"))
                        if not wait(lambda: port_up(E["LLAMA_PORT"]), 90, 2):
                            return self.reply(504, {"error": "la pile IA n'a pas demarre en 90 s", "woken": woken})
                    return self.reply(200, {"pc_up": True, "stack_up": True, "woken": woken,
                                            "started": started, "seconds": round(time.time() - t0)})
                self.reply(404, {"routes": ["/status", "/wake", "/stop"]})
            def log_message(self, *a):
                pass
        ThreadingHTTPServer(("0.0.0.0", int(E["PORT"])), H).serve_forever()