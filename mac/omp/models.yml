# omp : le LLM du PC, via Tailscale. PC_HOST = nom ou IP Tailscale du PC (remplace par install.sh).
# La cle n'est pas ecrite ici : "apiKey" donne le NOM d'une variable d'environnement
# (LLAMA_PC_KEY), definie dans ~/.zshrc a partir du fichier ~/.config/opencode/llama-key.
providers:
  pc:
    baseUrl: http://PC_HOST:8080/v1
    api: openai-completions
    apiKey: LLAMA_PC_KEY
    authHeader: true
    models:
      # Contexte : 64k par conversation (le serveur a 2 emplacements de 64k).
      - id: cybertiel
        name: Cyber-Tiel 35B-A3B (code, prefill rapide)
        contextWindow: 65536
        maxTokens: 32768
      - id: cybertiel-mtp
        name: Cyber-Tiel 35B-A3B (code, generation rapide MTP)
        contextWindow: 65536
        maxTokens: 32768
      - id: heretic
        name: Qwen3.6 35B-A3B heretic (general)
        contextWindow: 65536
        maxTokens: 32768
      - id: cybertiel-262k
        name: Cyber-Tiel 35B-A3B (code, contexte 262k)
        contextWindow: 262144
        maxTokens: 32768
