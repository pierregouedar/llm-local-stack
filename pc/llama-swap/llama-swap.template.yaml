# Modele de config llama-swap. NE PAS editer llama-swap.yaml (genere) : editer ce fichier.
# start-ai.ps1 remplace {{LLAMA_SERVER}}, {{MODELS_DIR}} (pc/stack.json) et {{API_KEY}} (pc/secrets/).
#
# Une seule adresse OpenAI-compatible pour tous les modeles ; le modele demande ("model" dans la
# requete) est charge a la volee, le precedent est decharge (un seul tient dans 10 Go de VRAM).
#
# Reglages mesures sur RTX 3080 10 Go + Ryzen 7 3800X + 32 Go DDR4 (voir docs/BENCHMARKS.md).
# Les valeurs de -ncmoe dependent de ta VRAM : voir docs/PARAMETRES.md pour les ajuster.

healthCheckTimeout: 300

# Cle d'API exigee sur toutes les requetes (Authorization: Bearer ...).
apiKeys:
  - "{{API_KEY}}"

macros:
  # -ngl 99 + -ncmoe N : tout sur GPU sauf les experts de N couches (sur CPU)
  # -b/-ub 4096        : gros lots, +41 % de prefill quand des experts sont sur CPU
  # --load-mode none   : pas de mmap, +36 % de prefill (x2,3 a 8k)
  # -t 6               : la generation est limitee par la RAM ; 6 threads > 8 > 16 (Zen 2, 8 coeurs)
  # -ctk/-ctv q8_0     : meme vitesse que f16, moins de VRAM
  llama: >-
    {{LLAMA_SERVER}}
    --host 127.0.0.1 --port ${PORT}
    --fit off -ngl 99 -t 6 -fa on -b 4096 -ub 4096 --load-mode none
    -ctk q8_0 -ctv q8_0 --jinja

models:
  # Prefill le plus rapide (~2950 t/s a 32k), generation ~47 t/s, 64k par conversation.
  # -np 2 : la session principale et les requetes annexes de l'agent (titres, sous-agents)
  # ne s'ecrasent pas le cache. --checkpoint-min-step : points de reprise (modele hybride).
  cybertiel:
    name: "Cyber-Tiel Coder 35B-A3B (code, prefill rapide)"
    cmd: >-
      ${llama}
      -m {{MODELS_DIR}}/Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_S.gguf
      -ncmoe 32 -c 131072 -np 2
      --checkpoint-min-step 2048
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0
      --reasoning-budget 4000
      --reasoning-budget-message "Stop thinking now and act."
    env: ["CUDA_MODULE_LOADING=EAGER"]   # evite "CUDA error: shared object initialization failed" au demarrage
    ttl: 0

  # Generation la plus rapide (~50 t/s) grace au MTP (2 tokens predits), prefill ~2380 t/s.
  # 4 couches d'experts de plus sur CPU et cache/lot du MTP reduits pour tenir en VRAM.
  cybertiel-mtp:
    name: "Cyber-Tiel Coder 35B-A3B (code, generation rapide MTP)"
    cmd: >-
      ${llama}
      -m {{MODELS_DIR}}/Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_S.gguf
      -ncmoe 36 -c 131072 -np 2
      --checkpoint-min-step 2048
      --spec-type draft-mtp --spec-draft-n-max 2
      -ctkd q8_0 -ctvd q8_0 --spec-draft-n-ubatch 512
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0
      --reasoning-budget 4000
      --reasoning-budget-message "Stop thinking now and act."
    env: ["CUDA_MODULE_LOADING=EAGER"]
    ttl: 0

  # Longues sessions : 262k partages entre les 2 emplacements (--kv-unified) -> une conversation
  # peut monter a ~250k. Sans MTP (ne tient pas en 10 Go a 262k).
  # Prefill 2440 / 2178 / 1879 t/s a 32k / 64k / 128k, generation 40 / 36 / 32 t/s.
  cybertiel-262k:
    name: "Cyber-Tiel Coder 35B-A3B (code, contexte 262k)"
    cmd: >-
      ${llama}
      -m {{MODELS_DIR}}/Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_S.gguf
      -ncmoe 38 -c 262144 -np 2 --kv-unified
      --checkpoint-min-step 2048
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0
      --reasoning-budget 4000
      --reasoning-budget-message "Stop thinking now and act."
    env: ["CUDA_MODULE_LOADING=EAGER"]
    ttl: 0

  # Usage general / chat.
  heretic:
    name: "Qwen3.6 35B-A3B heretic (general)"
    cmd: >-
      ${llama}
      -m {{MODELS_DIR}}/Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-Q4_K_S.gguf
      -ncmoe 34 -c 65536 -np 1
      --spec-type draft-mtp
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0
    env: ["CUDA_MODULE_LOADING=EAGER"]
    ttl: 0
